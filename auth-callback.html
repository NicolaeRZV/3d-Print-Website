<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autentificare — artblu</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='20' width='14' height='5' rx='2' fill='%234DA3FF'/%3E%3Crect x='4' y='12' width='22' height='5' rx='2' fill='%232553F2'/%3E%3Crect x='4' y='4' width='28' height='5' rx='2' fill='%230F1B2D'/%3E%3C/svg%3E">
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#F4F6F9;color:#161B22;padding:24px;}
  .box{max-width:420px;width:100%;background:#fff;border:1px solid #E3E7ED;border-radius:16px;padding:28px;text-align:center;box-shadow:0 16px 40px rgba(15,27,45,0.10);}
  h1{font-size:20px;margin:0 0 8px;}
  p{font-size:14px;color:#5B6472;line-height:1.55;margin:0 0 16px;}
  a{color:#2553F2;font-weight:600;}
  .err{color:#E0263E;}
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Se finalizează autentificarea…</h1>
  <p id="msg">Un moment, te redirecționăm.</p>
  <p id="actions" hidden><a href="login.html">Înapoi la autentificare</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
(async function () {
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');
  const actions = document.getElementById('actions');
  const params = new URLSearchParams(window.location.search);
  const hashRaw = window.location.hash.replace(/^#/, '');
  const hash = hashRaw.includes('=') ? new URLSearchParams(hashRaw) : new URLSearchParams();
  const authType = hash.get('type') || params.get('type') || '';

  try {
    const code = params.get('code');
    if (code) {
      const { error } = await artbluAuth.auth.exchangeCodeForSession(code);
      if (error) throw error;
    } else {
      await new Promise(r => setTimeout(r, 800));
    }

    const { data: { session }, error: sessionErr } = await artbluAuth.auth.getSession();
    if (sessionErr) throw sessionErr;
    if (!session) throw new Error('Sesiune invalidă. Link expirat sau deja folosit.');

    window.history.replaceState({}, '', 'auth-callback.html');

    if (authType === 'recovery') {
      window.location.href = 'login.html?reset=1';
      return;
    }

    window.location.href = 'account.html';
  } catch (err) {
    title.textContent = 'Link invalid sau expirat';
    msg.className = 'err';
    msg.textContent = (err.message || 'Nu am putut finaliza autentificarea.') + ' Cere un email nou din pagina de autentificare după ce Supabase Site URL e setat corect (vezi supabase/AUTH-SETUP.md).';
    actions.hidden = false;
  }
})();
</script>
</body>
</html>
