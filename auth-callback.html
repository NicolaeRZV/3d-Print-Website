<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autentificare — artblu</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='20' width='14' height='5' rx='2' fill='%234DA3FF'/%3E%3Crect x='4' y='12' width='22' height='5' rx='2' fill='%232553F2'/%3E%3Crect x='4' y='4' width='28' height='5' rx='2' fill='%230F1B2D'/%3E%3C/svg%3E">
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#F4F6F9;color:#161B22;padding:24px;}
  .box{max-width:420px;width:100%;background:#fff;border:1px solid #E3E7ED;border-radius:16px;padding:28px;text-align:center;box-shadow:0 16px 40px rgba(15,27,45,0.10);}
  h1{font-size:20px;margin:0 0 8px;}
  p{font-size:14px;color:#5B6472;line-height:1.55;margin:0 0 16px;}
  a{color:#2553F2;font-weight:600;}
  .err{color:#E0263E;}
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Se finalizează autentificarea…</h1>
  <p id="msg">Un moment, te redirecționăm.</p>
  <p id="actions" hidden><a id="back-link" href="login.html?forgot=1">Cere un link nou de resetare</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
(async function () {
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');
  const actions = document.getElementById('actions');
  const backLink = document.getElementById('back-link');

  function fail(text, href) {
    title.textContent = 'Link invalid sau expirat';
    msg.className = 'err';
    msg.textContent = text;
    actions.hidden = false;
    if (href) backLink.href = href;
  }

  function mapErr(err) {
    const raw = String(err?.message || err || '');
    const m = raw.toLowerCase();
    if (m.includes('artbluauth is not defined') || m.includes('supabase is not defined')) {
      return 'Nu s-au încărcat scripturile de autentificare. Reîncarcă pagina.';
    }
    if (m.includes('both auth code and code verifier') || m.includes('code verifier')) {
      return 'Acest tip de link PKCE necesită același browser. Pentru resetare parolă, folosește șablonul TokenHash din AUTH-SETUP.md (funcționează pe orice dispozitiv), apoi cere un email nou.';
    }
    if (m.includes('expired') || m.includes('invalid') || m.includes('otp')) {
      return 'Link expirat sau deja folosit. Cere un email nou din autentificare.';
    }
    return raw || 'Nu am putut finaliza autentificarea.';
  }

  async function safeSignOut(client) {
    try { await client.auth.signOut(); } catch (_) {}
  }

  try {
    let client = window.artbluAuth;
    if (!client) {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        throw new Error('Biblioteca Supabase nu s-a încărcat (CDN). Reîncarcă pagina.');
      }
      client = window.supabase.createClient(
        'https://tilfngrtldwevtiilxpq.supabase.co',
        'sb_publishable_A3fpQb9LjJb8XySpIJyJeg_gcjPOs3m',
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: 'pkce'
          }
        }
      );
      window.artbluAuth = client;
    }

    const params = new URLSearchParams(window.location.search);
    const hashRaw = window.location.hash.replace(/^#/, '');
    const hash = hashRaw.includes('=') ? new URLSearchParams(hashRaw) : new URLSearchParams();
    const authType = (hash.get('type') || params.get('type') || '').toLowerCase();
    const code = params.get('code');
    const tokenHash = params.get('token_hash') || params.get('token') || hash.get('token_hash') || hash.get('token');
    const isRecovery = authType === 'recovery' || params.get('reset') === '1';

    // Token-hash links work on any device (no PKCE verifier). Prefer this for email.
    if (tokenHash) {
      const otpType = authType || 'recovery';
      const { error } = await client.auth.verifyOtp({
        token_hash: tokenHash,
        type: otpType
      });
      if (error) throw error;
    } else if (code) {
      const { error } = await client.auth.exchangeCodeForSession(code);
      if (error) {
        // detectSessionInUrl may already have created a session from the same URL
        const { data: { session: existing } } = await client.auth.getSession();
        if (!existing) throw error;
      }
    } else if (hash.get('access_token')) {
      await new Promise(r => setTimeout(r, 500));
    } else {
      await new Promise(r => setTimeout(r, 600));
    }

    const { data: { session }, error: sessionErr } = await client.auth.getSession();
    if (sessionErr) throw sessionErr;
    if (!session) {
      throw new Error('Sesiune invalidă. Link expirat sau deja folosit — cere un email nou.');
    }

    window.history.replaceState({}, '', 'auth-callback.html');

    if (isRecovery || authType === 'recovery') {
      window.location.href = 'login.html?reset=1';
      return;
    }

    window.location.href = 'account.html';
  } catch (err) {
    console.error(err);
    let client = window.artbluAuth;
    try {
      if (client) {
        const { data: { session } } = await client.auth.getSession();
        const params = new URLSearchParams(window.location.search);
        const hashRaw = window.location.hash.replace(/^#/, '');
        const hash = hashRaw.includes('=') ? new URLSearchParams(hashRaw) : new URLSearchParams();
        const authType = (hash.get('type') || params.get('type') || '').toLowerCase();
        if (session && authType === 'recovery') {
          window.location.href = 'login.html?reset=1';
          return;
        }
        // Avoid dumping the user into account.html via an old leftover session
        await safeSignOut(client);
      }
    } catch (_) {}

    const hint = mapErr(err);
    const isPkce = /code verifier|pkce/i.test(String(err?.message || err || ''));
    fail(
      hint + ' Verifică Site URL / Redirect URLs în Supabase (AUTH-SETUP.md).',
      isPkce || /recovery|reset|parol/i.test(hint) ? 'login.html?forgot=1' : 'login.html'
    );
    backLink.textContent = isPkce || /recovery|reset|parol/i.test(hint)
      ? 'Cere un link nou de resetare'
      : 'Înapoi la autentificare';
  }
})();
</script>
</body>
</html>
