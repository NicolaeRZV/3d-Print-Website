<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contul meu — artblu</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://artblu.ro/account.html">
<link rel="stylesheet" href="cookie-consent.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='20' width='14' height='5' rx='2' fill='%234DA3FF'/%3E%3Crect x='4' y='12' width='22' height='5' rx='2' fill='%232553F2'/%3E%3Crect x='4' y='4' width='28' height='5' rx='2' fill='%230F1B2D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0F1B2D;
    --navy-800:#16243B;
    --blue-600:#2553F2;
    --blue-500:#4DA3FF;
    --blue-700:#1B3FC2;
    --orange-500:#FF7A1F;
    --bg:#F4F6F9;
    --white:#FFFFFF;
    --text-900:#161B22;
    --text-600:#5B6472;
    --border:#E3E7ED;
    --green:#1C9C6B;
    --red:#E0263E;
    --radius:16px;
    --shadow-sm:0 1px 3px rgba(15,27,45,0.08);
    --shadow-md:0 16px 40px rgba(15,27,45,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text-900);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  /* Matches index.html hide-ready-models. Remove this rule to show collection links again. */
  .ready-models-entry{display:none !important;}
  h1,h2,h3,h4{font-family:'Poppins',system-ui,sans-serif;margin:0;letter-spacing:-0.02em;}
  a{color:inherit;text-decoration:none;}
  button,input{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;}

  .auth-header{
    background:var(--navy-900);
    padding:16px 0;
    padding-top:max(16px, env(safe-area-inset-top));
  }
  .auth-header .inner{
    max-width:720px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-mark rect:nth-child(1){fill:var(--blue-500);}
  .logo-mark rect:nth-child(2){fill:var(--blue-600);}
  .logo-mark rect:nth-child(3){fill:rgba(255,255,255,0.35);}
  .logo-word{color:var(--white);font-size:21px;font-weight:700;font-family:'Poppins',sans-serif;}
  .logo-word span{color:var(--blue-500);}
  .header-links{display:flex;gap:8px;flex-wrap:wrap;}
  .header-link{
    font-size:13px;font-weight:600;color:#B9C2D2;padding:8px 12px;border-radius:8px;
    transition:background .15s,color .15s;
  }
  .header-link:hover{background:rgba(255,255,255,0.08);color:var(--white);}

  .account-main{
    max-width:720px;margin:0 auto;
    padding:32px 20px 48px;
    padding-bottom:max(48px, env(safe-area-inset-bottom));
  }
  .page-head{margin-bottom:24px;}
  .page-head h1{font-size:28px;margin-bottom:6px;}
  .page-head p{font-size:14px;color:var(--text-600);}

  .profile-card{
    background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
    border-radius:var(--radius);padding:24px;color:var(--white);
    display:flex;align-items:center;gap:18px;margin-bottom:20px;
    box-shadow:var(--shadow-md);
  }
  .avatar{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--blue-500),var(--blue-600));
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;font-family:'Poppins',sans-serif;
  }
  .profile-info h2{font-size:18px;margin-bottom:4px;}
  .profile-info p{font-size:13.5px;color:#B9C2D2;}

  .info-card{
    background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow-sm);margin-bottom:16px;
  }
  .info-card h3{font-size:15px;margin-bottom:6px;}
  .info-card > p{font-size:13px;color:var(--text-600);line-height:1.55;}

  .field{margin-top:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-600);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;
  }
  .field input:focus{outline:2px solid var(--blue-600);outline-offset:1px;border-color:var(--blue-600);}
  .form-msg{font-size:13px;margin-top:8px;min-height:18px;}
  .form-msg.ok{color:var(--green);}
  .form-msg.err{color:var(--red);}

  .prints-list,.orders-list{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .print-row{
    display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
    padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#F8FAFC;
  }
  .print-row h4{font-size:14px;margin:0 0 4px;font-family:'Poppins',sans-serif;}
  .print-row p{font-size:12.5px;color:var(--text-600);margin:0;line-height:1.45;}
  .print-status{
    flex-shrink:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:4px 8px;border-radius:999px;background:#EEF2FF;color:var(--blue-600);
  }
  .print-status.paid{background:#E8F8F1;color:var(--green);}
  .print-status.cod{background:#FFF4E5;color:#C56A00;}
  .print-empty{font-size:13px;color:var(--text-600);padding:8px 0;}

  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:10px;font-size:14px;font-weight:600;
    transition:transform .12s ease,background .15s;
  }
  .btn-primary{background:var(--orange-500);color:var(--white);}
  .btn-primary:hover{background:#E8650A;transform:translateY(-1px);}
  .btn-ghost{background:var(--white);border:1px solid var(--border);color:var(--text-900);}
  .btn-ghost:hover{background:#F8FAFC;}
  .btn-danger{background:#FEE2E5;color:var(--red);}
  .btn-danger:hover{background:#FECDD3;}
  .btn-small{padding:10px 14px;font-size:13px;}

  .loading-screen{
    min-height:50vh;display:flex;align-items:center;justify-content:center;
    color:var(--text-600);font-size:14px;
  }

  @media (max-width:560px){
    .profile-card{flex-direction:column;text-align:center;padding:22px 20px;}
    .page-head h1{font-size:24px;}
    .actions{flex-direction:column;}
    .actions .btn{width:100%;}
  }
</style>
</head>
<body>

<header class="auth-header">
  <div class="inner">
    <a href="index.html" class="logo" aria-label="artblu - pagina principală">
      <svg class="logo-mark" width="30" height="22" viewBox="0 0 30 22" aria-hidden="true">
        <rect x="0" y="16" width="14" height="4" rx="2"/>
        <rect x="0" y="9" width="22" height="4" rx="2"/>
        <rect x="0" y="2" width="30" height="4" rx="2"/>
      </svg>
      <span class="logo-word">art<span>blu</span></span>
    </a>
    <div class="header-links">
      <a href="index.html" class="header-link">Magazin</a>
    </div>
  </div>
</header>

<main class="account-main" id="account-content">
  <div class="loading-screen">Se încarcă contul…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="cookie-consent.js"></script>
<script>
const db = window.artbluAuth;
const content = document.getElementById('account-content');

function fmtLei(n) {
  if (n == null || n === '') return '—';
  return Number(n).toFixed(2).replace('.', ',') + ' lei';
}

function getInitials(name, email) {
  const source = name || email || '?';
  const parts = source.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return source.slice(0, 2).toUpperCase();
}

function statusClass(paymentStatus) {
  if (paymentStatus === 'paid') return 'paid';
  if (paymentStatus === 'unpaid_cod') return 'cod';
  return '';
}

function statusLabel(row) {
  const pay = row.payment_status || '';
  if (pay === 'paid') return 'plătit';
  if (pay === 'unpaid_cod') return 'ramburs';
  if (pay === 'pending') return 'în așteptare';
  return row.status || 'new';
}

function renderAccount(user) {
  const name = getDisplayName(user);
  const email = user.email || '';
  const initials = getInitials(user.user_metadata?.full_name, email);
  const joined = user.created_at
    ? new Date(user.created_at).toLocaleDateString('ro-RO', { year: 'numeric', month: 'long', day: 'numeric' })
    : '—';

  content.innerHTML = `
    <div class="page-head">
      <h1>Contul meu</h1>
      <p>Profil, comenzi din magazin și printuri personalizate.</p>
    </div>

    <div class="profile-card">
      <div class="avatar" aria-hidden="true">${initials}</div>
      <div class="profile-info">
        <h2 id="profile-name">${escapeHtml(name)}</h2>
        <p>${escapeHtml(email)}</p>
      </div>
    </div>

    <div class="info-card">
      <h3>Profil</h3>
      <p>Membru din <strong>${joined}</strong>. Poți actualiza numele afișat.</p>
      <div class="field">
        <label for="profile-fullname">Nume complet</label>
        <input id="profile-fullname" type="text" value="${escapeHtml(user.user_metadata?.full_name || '')}" autocomplete="name" placeholder="Ion Popescu">
      </div>
      <p class="form-msg" id="profile-msg"></p>
      <div class="actions">
        <button type="button" class="btn btn-ghost btn-small" id="save-profile-btn">Salvează profilul</button>
      </div>
    </div>

    <div class="info-card">
      <h3>Comenzi magazin</h3>
      <p>Produse din colecție plasate cu acest cont / email.</p>
      <div class="orders-list" id="orders-list"><p class="print-empty">Se încarcă…</p></div>
    </div>

    <div class="info-card">
      <h3>Printuri personalizate</h3>
      <p>Cererile STL / OBJ / 3MF pe care le-ai trimis.</p>
      <div class="prints-list" id="prints-list"><p class="print-empty">Se încarcă…</p></div>
    </div>

    <div class="actions">
      <a href="index.html#upload" class="btn btn-primary">Încarcă un model</a>
      <a href="index.html#catalog" class="btn btn-ghost ready-models-entry">Vezi colecția</a>
      <button type="button" class="btn btn-danger" id="logout-btn">Deconectare</button>
    </div>
  `;

  document.getElementById('logout-btn').addEventListener('click', async () => {
    try {
      await signOut();
      window.location.href = 'index.html';
    } catch (err) {
      alert(err.message || 'Nu am putut face deconectarea.');
    }
  });

  document.getElementById('save-profile-btn').addEventListener('click', async () => {
    const msg = document.getElementById('profile-msg');
    const fullName = document.getElementById('profile-fullname').value.trim();
    msg.className = 'form-msg';
    msg.textContent = '';
    try {
      const updated = await updateProfile(fullName);
      document.getElementById('profile-name').textContent = getDisplayName(updated);
      msg.className = 'form-msg ok';
      msg.textContent = 'Profil actualizat.';
    } catch (err) {
      msg.className = 'form-msg err';
      msg.textContent = err.message || 'Nu am putut salva.';
    }
  });

  loadStoreOrders(user);
  loadCustomPrints(user);
}

async function loadStoreOrders(user) {
  const list = document.getElementById('orders-list');
  if (!list) return;
  try {
    const emailFilter = (user.email || '').replace(/"/g, '');
    const { data, error } = await db
      .from('orders')
      .select('id, created_at, items, subtotal, shipping_fee, cod_fee, total, status, payment_method, payment_status')
      .or(`user_id.eq.${user.id},customer_email.eq."${emailFilter}"`)
      .order('created_at', { ascending: false })
      .limit(20);
    if (error) throw error;
    if (!data || !data.length) {
      list.innerHTML = '<p class="print-empty">Nicio comandă din magazin încă. <a href="index.html#catalog" class="ready-models-entry">Vezi colecția →</a></p>';
      return;
    }
    list.innerHTML = data.map(row => {
      const date = new Date(row.created_at).toLocaleDateString('ro-RO');
      const items = Array.isArray(row.items) ? row.items : [];
      const label = items.length
        ? (items.length === 1 ? items[0].name : `${items.length} produse`)
        : 'Comandă';
      const total = row.total != null ? row.total : row.subtotal;
      const pay = row.payment_method === 'ramburs' ? 'Ramburs' : 'Card';
      return `
        <article class="print-row">
          <div>
            <h4>${escapeHtml(label)}</h4>
            <p>${fmtLei(total)} · ${pay}<br>${date} · ID ${escapeHtml(String(row.id).slice(0, 8))}…</p>
          </div>
          <span class="print-status ${statusClass(row.payment_status)}">${escapeHtml(statusLabel(row))}</span>
        </article>`;
    }).join('');
  } catch (err) {
    console.error(err);
    list.innerHTML = '<p class="print-empty">Nu am putut încărca comenzile. Rulează supabase/auth-orders.sql dacă lipsește coloana user_id.</p>';
  }
}

async function loadCustomPrints(user) {
  const list = document.getElementById('prints-list');
  if (!list) return;
  try {
    const emailFilter = (user.email || '').replace(/"/g, '');
    const { data, error } = await db
      .from('custom_prints')
      .select('id, created_at, file_name, files, material, color_name, estimated_price, total, status, payment_method, payment_status, customer_address')
      .or(`user_id.eq.${user.id},customer_email.eq."${emailFilter}"`)
      .order('created_at', { ascending: false })
      .limit(20);
    if (error) throw error;
    if (!data || !data.length) {
      list.innerHTML = '<p class="print-empty">Nicio cerere încă. <a href="index.html#upload">Încarcă primul model →</a></p>';
      return;
    }
    list.innerHTML = data.map(row => {
      const date = new Date(row.created_at).toLocaleDateString('ro-RO');
      const price = row.total != null ? row.total : row.estimated_price;
      const files = Array.isArray(row.files) && row.files.length
        ? row.files
        : (row.file_name ? row.file_name.split(', ') : ['Model 3D']);
      const fileLabel = Array.isArray(files) && files[0]?.name
        ? (files.length > 1 ? `${files.length} modele` : files[0].name)
        : (typeof files[0] === 'string' ? (files.length > 1 ? `${files.length} modele` : files[0]) : 'Model 3D');
      const finishBits = Array.isArray(files)
        ? [...new Set(files.map(f => [f.material, f.color_name].filter(Boolean).join(' · ')).filter(Boolean))]
        : [];
      const finishLabel = finishBits.length
        ? finishBits.join(' / ')
        : `${row.material || '—'} · ${row.color_name || '—'}`;
      const pay = row.payment_method === 'ramburs' ? 'Ramburs' : (row.payment_method === 'card' ? 'Card' : '');
      return `
        <article class="print-row">
          <div>
            <h4>${escapeHtml(fileLabel)}</h4>
            <p>${escapeHtml(finishLabel)} · ${fmtLei(price)}${pay ? ' · ' + pay : ''}<br>${escapeHtml(row.customer_address || '')}<br>${date}</p>
          </div>
          <span class="print-status ${statusClass(row.payment_status)}">${escapeHtml(statusLabel(row))}</span>
        </article>`;
    }).join('');
  } catch (err) {
    console.error(err);
    list.innerHTML = '<p class="print-empty">Nu am putut încărca cererile. Rulează SQL-ul din supabase/custom-prints.sql dacă tabelul lipsește.</p>';
  }
}

(async function boot() {
  try {
    const user = await getCurrentUser();
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    renderAccount(user);
  } catch (err) {
    console.error(err);
    window.location.href = 'login.html';
  }
})();
</script>
</body>
</html>
